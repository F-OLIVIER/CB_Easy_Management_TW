# En-têtes de sécurité de la PWA.
# Inclus au niveau server ET dans chaque location qui définit ses propres add_header :
# dans Nginx, un add_header de location remplace tous ceux hérités du bloc server.

# CSP : uniquement les ressources de l'application, plus Discord (API de connexion, avatars et icônes).
#  - style 'unsafe-inline' : attributs style posés par Vue, Quill et html2canvas (aucun script en ligne autorisé)
#  - img blob: (aperçu d'image avant envoi) et data: (images intégrées, export des groupes)
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://cdn.discordapp.com; font-src 'self'; connect-src 'self' https://discord.com; worker-src 'self'; manifest-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# HTTPS obligatoire (ignoré par les navigateurs tant que la page est servie en HTTP)
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
