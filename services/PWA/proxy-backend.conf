# Relais vers le backend Go, inclus dans chaque location qui le contacte.
# (proxy_hide_header et proxy_set_header ne sont hérités que si la location n'en définit aucun.)
proxy_pass http://${SITE_UPSTREAM};
# Host d'origine conservé, port compris : le backend le compare à l'en-tête Origin (protection CSRF)
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $forwarded_proto;
# En-têtes de sécurité du backend remplacés par ceux de la PWA (une seule politique)
proxy_hide_header Content-Security-Policy;
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
